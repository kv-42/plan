<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<title>План отпуска</title>
<style>
:root{
  --bg:#f7f6f2;--surface:#fff;--surface-2:#efede7;--text:#1a1a19;--text-2:#4a4945;--muted:#6b6a65;--border:rgba(11,11,11,.12);
  --vac:#2a78d6;--vac-text:#fff;--per:#e34948;--per-soft:#f2a9a8;--avoid:#c98500;
  --ok:#0b7a0b;--warn:#a85a00;--bad:#c42f2f;--accent-bg:#1a1a19;--accent-text:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --bg:#121211;--surface:#1c1c1b;--surface-2:#272725;--text:#f0efec;--text-2:#c9c8be;--muted:#9a998f;--border:rgba(255,255,255,.12);
  --vac:#3987e5;--vac-text:#fff;--per:#ef6b6b;--per-soft:#8a3a3a;--avoid:#eda100;
  --ok:#4cc24c;--warn:#f0a23a;--bad:#ef6b6b;--accent-bg:#f0efec;--accent-text:#121211;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:860px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font-size:22px;font-weight:650;margin:0 0 2px}
h2{font-size:16px;font-weight:650;margin:22px 0 8px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px}
button,input,textarea,select{font:inherit;color:inherit}
button{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;-webkit-tap-highlight-color:transparent}
button.primary{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent-bg)}
button.sm{min-height:40px;padding:0 12px;font-size:15px}
button.icon{min-width:44px;padding:0}
input,textarea,select{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;min-height:44px;width:100%;font-size:16px}
input[type=number]{width:76px}
input[type=date]{width:auto;min-width:150px}
textarea{min-height:200px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px}
label.f{display:block;font-size:13px;color:var(--text-2);margin:10px 0 4px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.hidden{display:none!important}
body.view .edit-only{display:none!important}
body:not(.view) .view-only{display:none!important}
#coach{position:fixed;inset:0;z-index:50}
#coach .spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);outline:2px solid #fff;transition:top .25s,left .25s,width .25s,height .25s;pointer-events:none}
#coach .tip{position:fixed;left:12px;right:12px;max-width:440px;margin:0 auto;background:var(--surface);color:var(--text);border-radius:14px;padding:14px;font-size:16px;line-height:1.4}
#coach .tip .n{font-size:12px;color:var(--muted);margin-bottom:4px}
#coach .tip .row{justify-content:flex-end;margin-top:10px}
/* lock */
.lock{max-width:340px;margin:12vh auto 0;text-align:center}
.lock input{font-size:28px;letter-spacing:.3em;text-align:center;margin:14px 0}
.err{color:var(--bad);font-size:14px;min-height:20px}
/* summary */
.sum{display:grid;gap:6px;font-size:14px}
.st{display:flex;gap:8px;align-items:flex-start}
.st i{font-style:normal;font-weight:700;width:16px;flex:none;text-align:center}
.st.info i{color:var(--per)}.st.ok i{color:var(--ok)}.st.warn i{color:var(--warn)}.st.bad i{color:var(--bad)}
/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-2);margin:10px 0 8px}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.lg{width:16px;height:16px;border-radius:4px;position:relative;display:inline-block}
/* parts */
.parts{display:grid;gap:10px}
.part .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.part .x{margin-left:auto}
.part button.rng{border:0;background:none;padding:0;min-height:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--muted)}
.prow{flex-wrap:nowrap;gap:6px}.prow select{flex:1;min-width:0;width:auto;padding:0 8px}
.issues{font-size:13px;margin-top:6px;color:var(--text-2)}
.issues .good{color:var(--ok)}
.strip{display:flex;gap:1px;margin-top:8px;height:14px}
.strip i{flex:1;min-width:2px;background:var(--vac);border-radius:2px;position:relative}
.strip i.p::after,.strip i.ps::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--per);border-radius:0 0 2px 2px}
.strip i.ps::after{background:var(--per-soft)}
.strip i.a{box-shadow:inset 0 0 0 2px var(--avoid)}
.strip i.h{opacity:.45}
/* calendar */
.months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}
@media (min-width:640px){.months{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:820px){.months{grid-template-columns:repeat(4,minmax(0,1fr))}}
.months>div{scroll-margin-top:64px}
.mname{font-size:14px;font-weight:600;margin:0 0 4px 2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wd{font-size:10px;color:var(--muted);text-align:center}
.d{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:5px;color:var(--text)}
.d[data-d]{cursor:pointer;-webkit-tap-highlight-color:transparent}
.d.we{color:var(--muted)}
.d.v{background:var(--vac);color:var(--vac-text);font-weight:600}
.d.a{box-shadow:inset 0 0 0 2px var(--avoid)}
.d.h{font-weight:700;text-decoration:underline;text-underline-offset:2px}
.d.sel{outline:2.5px solid var(--text);outline-offset:-1px;z-index:1}
.pb{position:absolute;left:2px;right:2px;bottom:1px;height:4px;border-radius:2px;background:var(--per);box-shadow:0 0 0 1px var(--surface)}
.pb.s{background:var(--per-soft)}
.lg .pb{bottom:2px}
.months.big{grid-template-columns:1fr;gap:20px}
@media (min-width:640px){.months.big{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:960px){.months.big{grid-template-columns:repeat(3,minmax(0,1fr))}}
.months.big .cal{gap:4px}.months.big .d{font-size:16px;border-radius:9px}.months.big .wd{font-size:12px}
.months.big .mname{font-size:16px;margin-bottom:6px}.months.big .pb{height:5px;left:6px;right:6px;bottom:4px}
/* link */
.savebar input.pin{width:120px;letter-spacing:.2em;text-align:center}
.link{font-family:ui-monospace,monospace;flex:1;min-width:0}
/* tabs: bottom bar, thumb reach, safe area */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;gap:2px;padding:4px max(8px,env(safe-area-inset-left)) calc(4px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border)}
.tabs button{flex:1;max-width:150px;min-height:52px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.tabs button[aria-selected=true]{color:var(--text);font-weight:600}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.dot span::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:4px;vertical-align:1px}
.head{margin-bottom:12px}
.head h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.head .row button.sm{padding:0 10px}
@media (max-width:420px){.head h1{font-size:20px}}
/* move panel */
.selbar{position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:11;max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--muted);border-radius:16px;padding:10px 12px}
.selbar .si{font-size:15px;position:relative;padding-right:40px}.selbar .si span{color:var(--muted);font-size:13px}
.selbar .sx{position:absolute;right:-6px;top:-8px;min-height:40px;min-width:40px;border:0;background:transparent;font-size:18px;color:var(--muted)}
.selbar .sn{flex:1.3;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.selbar .sa{display:flex;gap:6px;margin-top:8px}.selbar .sa button{flex:1;min-height:44px;padding:0 4px;font-size:18px}
.selbar .sa button[data-s=fit]{flex:2;font-size:15px}
.selbar .sh{font-size:12px;color:var(--muted);margin-top:6px;min-height:16px}
body.hasSel .wrap{padding-bottom:calc(240px + env(safe-area-inset-bottom))}
.chips{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;margin:0 -16px 4px;padding:8px 16px;background:var(--bg);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:40px;border-radius:999px;font-size:14px;padding:0 14px;white-space:nowrap}
.chips button.on{background:var(--vac);border-color:var(--vac);color:#fff}
.ideas{font-size:13px;color:var(--text-2);margin:0 0 10px}
.ideas .row{gap:6px;margin-top:6px}.ideas button{min-height:40px;font-size:14px;border-style:dashed;text-align:left}
.note{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<main class="wrap">

<section id="lock" class="lock hidden">
  <h1 data-t="title"></h1>
  <p class="sub" data-t="lockSub"></p>
  <form id="lockForm" autocomplete="off">
    <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN" maxlength="32">
    <div class="err" id="lockErr" role="alert"></div>
    <button class="primary" type="submit" id="lockBtn" style="width:100%" data-t="open"></button>
  </form>
  <p class="hint edit-only" style="margin-top:18px"><a href="#" id="newLink" style="color:inherit" data-t="newLink"></a></p>
  <p class="hint" style="margin-top:18px"><span id="ver"></span> · <button type="button" class="lang" style="min-height:32px;padding:0 10px;font-size:13px"></button></p>
</section>

<section id="empty" class="lock hidden">
  <h1 data-t="title"></h1>
  <p class="sub" data-t="emptySub"></p>
  <a href="?edit" style="color:inherit;font-size:14px" data-t="createOwn"></a>
</section>

<section id="app" class="hidden">
  <header class="head"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h1 data-t="title"></h1>
    <span class="row" style="gap:6px;flex-wrap:nowrap"><button class="sm lang" type="button"></button><button class="sm icon" id="help" type="button" data-ta="howTo">?</button><button class="sm view-only" id="toEdit" type="button" data-t="toEdit"></button></span></div>
  <p class="sub" id="forecast" style="margin:0"></p></header>

  <div data-pane="cal">
  <div class="chips edit-only" id="chips" role="toolbar" data-ta="partsH"></div>
  <div class="ideas edit-only" id="ideas"></div>
  <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><p class="sub" id="calTitle" style="margin:0"></p><button class="sm" id="zoom" type="button"></button></div>
  <div class="legend">
    <span><i class="lg" style="background:var(--vac)"></i><span data-t="legVac"></span></span>
    <span><i class="lg" style="background:var(--surface-2)"><i class="pb"></i></i><span data-t="legPer"></span></span>
    <span><i class="lg" style="background:var(--surface-2)"><i class="pb s"></i></i><span data-t="legMaybe"></span></span>
    <span><i class="lg" style="box-shadow:inset 0 0 0 2px var(--avoid)"></i><span data-t="legAvoid"></span></span>
    <span><b style="text-decoration:underline">15</b><span data-t="legHol"></span></span>
    <span><span style="color:var(--muted)">15</span><span data-t="legOff"></span></span>
  </div>
  <div class="months" id="months"></div>
  </div>

  <div data-pane="parts" class="hidden">
  <div class="card sum" id="summary"></div>
  <h2 data-t="partsH"></h2>
  <div class="parts" id="parts"></div>
  <div class="row edit-only" style="margin-top:10px">
    <button class="sm" id="addC" data-t="addC"></button>
    <button class="sm" id="addY" data-t="addY"></button>
    <button class="sm primary" id="fitAll" data-t="fitAll"></button>
  </div>
  <p class="hint edit-only" data-t="fitHint"></p>
  <p class="note" data-t="noteParts"></p>
  </div>

  <div data-pane="data" class="hidden edit-only">
  <div class="card" id="editor">
    <div class="row">
      <div><label class="f" for="eFrom" data-t="eFrom"></label><input id="eFrom" type="month"></div>
      <div><label class="f" for="eTo" data-t="eTo"></label><input id="eTo" type="month"></div>
      <div><label class="f" for="eFr" data-t="eFr"></label><input id="eFr" type="number" min="0" max="10"></div>
    </div>
    <div class="row">
      <div><label class="f" for="eCarry" data-t="eCarry"></label><input id="eCarry" type="number" min="0" max="200"></div>
      <div><label class="f" for="eYearDays" data-t="eYearDays"></label><input id="eYearDays" type="number" min="0" max="200"></div>
      <div><label class="f" for="eMin" data-t="eMin"></label><input id="eMin" type="number" min="0" max="100"></div>
    </div>
    <label class="row" style="margin-top:10px;font-size:14px"><input id="eSplit" type="checkbox" style="width:auto;min-height:0"> <span data-t="eSplit"></span></label>
    <label class="f" for="eCycles" data-t="eCycles"></label>
    <textarea id="eCycles" spellcheck="false" placeholder="12.10.2026 5&#10;09.11.2026 4"></textarea>
    <label class="f" for="eHol" data-t="eHol"></label>
    <input id="eHol" spellcheck="false">
    <div class="row" style="align-items:flex-start">
      <div style="flex:1;min-width:140px"><label class="f" for="eW" data-t="eW"></label><input id="eW" spellcheck="false"></div>
      <div style="flex:1;min-width:140px"><label class="f" for="eWs" data-t="eWs"></label><input id="eWs" spellcheck="false"></div>
    </div>
    <label class="f" for="eAv" data-t="eAv"></label>
    <input id="eAv" spellcheck="false">
    <p class="hint" data-th="fmtHint"></p>
    <div class="err" id="edErr"></div>
    <button class="primary" id="apply" style="margin-top:6px;width:100%" data-t="apply"></button>
  </div>
  </div>

  <div data-pane="link" class="hidden edit-only">
  <div class="card savebar" id="savebar">
    <div class="row">
      <span style="font-size:14px;flex:1;min-width:140px" id="saveMsg" data-t="saveMsg0"></span>
      <input class="pin" id="pinSave" type="password" inputmode="numeric" placeholder="PIN" data-ta="pinAria" autocomplete="off">
      <button class="primary" id="save" data-t="save"></button>
    </div>
    <div class="hidden" id="links">
      <label class="f" for="linkOut" data-t="linkView"></label>
      <div class="row" style="flex-wrap:nowrap"><input class="link" id="linkOut" readonly><button class="sm" data-copy="linkOut" data-t="copy"></button></div>
      <label class="f" for="linkEdit" data-t="linkEdit"></label>
      <div class="row" style="flex-wrap:nowrap"><input class="link" id="linkEdit" readonly><button class="sm" data-copy="linkEdit" data-t="copy"></button></div>
    </div>
  </div>
  <p class="note" data-t="noteLink"></p>
  </div>
</section>
</main>
<div class="selbar hidden" id="selbar" role="region" data-ta="selAria"></div>
<div id="coach" class="hidden" role="dialog" aria-modal="true" data-ta="howTo"><div class="spot"></div>
  <div class="tip"><div class="n" id="coachN"></div><div id="coachT"></div>
  <div class="row"><button type="button" id="coachX" data-t="close"></button><button type="button" class="primary" id="coachNext"></button></div></div></div>
<nav class="tabs hidden" id="tabs" role="tablist" data-ta="tabsAria"></nav>

<script>
"use strict";
const ITER=400000, DAY=864e5, BUILD='11';
let EDIT=new URLSearchParams(location.search).has('edit');
document.body.classList.toggle('view',!EDIT);
const $=id=>document.getElementById(id);
const enc=new TextEncoder(),dec=new TextDecoder();

/* ---------- i18n: Russian / Belarusian ---------- */
const I={ru:{
  title:'План отпуска',lockSub:'Данные зашифрованы в ссылке. Введите PIN.',open:'Открыть',newLink:'Создать новую пустую ссылку',
  emptySub:'Откройте страницу по ссылке с данными.',createOwn:'Создать свой план',howTo:'Как пользоваться',toEdit:'Изменить',
  legVac:'отпуск',legPer:'месячные',legMaybe:'возможно',legAvoid:'нежелательно',legHol:'праздник',legOff:'выходной',
  partsH:'Части отпуска',addC:'+ из переноса',addY:'+ из нового года',fitAll:'Подобрать все по месяцам',
  fitHint:'Выберите месяц у части — «Подобрать» поставит её так, чтобы вместе с выходными и праздниками вышло больше дней отдыха подряд, обходя нежелательные даты.',
  noteParts:'Дни отпуска считаются календарными, праздники не входят и продлевают отпуск. Прогноз месячных — из дат в данных (например, из Flo), дальше по среднему циклу. Ничего не хранится на сервере: всё в ссылке, расшифровка в браузере.',
  eFrom:'План с',eTo:'по',eFr:'Запас прогноза, ± дн.',eCarry:'Перенос, дн.',eYearDays:'На год, дн.',eMin:'Одна часть не короче',eSplit:'перенос можно делить на части',
  eCycles:'Месячные: дата начала и сколько дней, по строке (история или прогноз Flo; дальше продлится по среднему циклу)',
  eHol:'Праздники (не входят в дни отпуска)',eW:'Доп. выходные (переносы)',eWs:'Рабочие выходные (отработки)',eAv:'Нежелательные даты',
  fmtHint:'Формат: <code>1.05</code>, <code>1.05-3.05</code>, <code>вс3.09</code> (3-е воскресенье сентября), <code>12.06.2027</code>',
  apply:'Применить',saveMsg0:'Новая ссылка — можно с другим PIN',pinAria:'PIN для ссылки',save:'Сохранить',
  linkView:'Для просмотра (отправить)',linkEdit:'Для редактирования (себе)',copy:'Копировать',copied:'Скопировано ✓',selected:'Выделено',
  noteLink:'Ссылку для просмотра можно отправлять: в ней только календарь, без редактирования. PIN сообщайте отдельно.',
  selAria:'Выбранная часть отпуска',close:'Закрыть',next:'Дальше',done:'Готово',tabsAria:'Разделы',
  tabCal:'Календарь',tabParts:'Отпуск',tabData:'Данные',tabLink:'Ссылка',
  months:['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],
  monG:['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'],wds:['пн','вт','ср','чт','пт','сб','вс'],
  forecast:(a,sd,p,f,nx)=>`Цикл ≈ ${a} дн.${sd}, месячные ≈ ${p} дн., запас ±${f}.${nx?' Ближайшие: '+nx:''}`,
  noCycles:'Нет дат месячных — прогноза нет. Добавьте даты в «Данные».',dirtyMsg:'Есть изменения — сохраните в новую ссылку',
  sumCarry:(sc,c,one,br,left)=>`Перенос: ${sc} из ${c} дн.${one?' — одним куском':''}${br?' (разбит, так нельзя)':''}${left?' — осталось '+left:''}`,
  sumYear:(y,sy,yd,left,over)=>`Новый год (${y}): ${sy} из ${yd} дн.${left?' — осталось '+left:''}${over?' — перебор '+over:''}`,
  sumMinOk:m=>`Есть часть не короче ${m} дн.`,sumMinBad:(m,mx)=>`Нужна хотя бы одна часть от ${m} дн. (сейчас самая длинная ${mx})`,

/* ---------- dates: integer day numbers (UTC) ---------- */
const WDN={пн:1,вт:2,аў:2,ср:3,чт:4,чц:4,пт:5,сб:6,вс:0,нд:0};
const dn=(y,m,d)=>Math.round(Date.UTC(y,m-1,d)/DAY);
const dt=n=>new Date(n*DAY);
const iso=n=>dt(n).toISOString().slice(0,10);
const fromIso=s=>{const [y,m,d]=s.split('-').map(Number);return dn(y,m,d)};
const nice=n=>{const x=dt(n);return x.getUTCDate()+' '+t('monG')[x.getUTCMonth()]};
const niceY=n=>nice(n)+' '+dt(n).getUTCFullYear();
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};

function parseSpecs(str,years){
  const out=new Set(),bad=new Set();
  for(const year of [].concat(years))for(const raw of (str||'').split(/[,;\s]+/).filter(Boolean)){
    let m;
    if((m=raw.match(/^(пн|вт|аў|ср|чт|чц|пт|сб|вс|нд)(\d)\.(\d{1,2})$/i))){
      const wd=WDN[m[1].toLowerCase()],k=+m[2],mo=+m[3];let d=dn(year,mo,1),c=0;
      while(dt(d).getUTCMonth()===mo-1){if(dt(d).getUTCDay()===wd&&++c===k){out.add(d);break}d++}
    }else if((m=raw.match(/^(\d{1,2})\.(\d{1,2})(?:\.(\d{4}))?(?:-(\d{1,2})\.(\d{1,2})(?:\.(\d{4}))?)?$/))){
      const a=dn(m[3]?+m[3]:year,+m[2],+m[1]);
      const b=m[4]?dn(m[6]?+m[6]:(m[3]?+m[3]:year),+m[5],+m[4]):a;
      if(b>=a&&b-a<400)range(a,b).forEach(x=>out.add(x));else bad.add(raw);
    }else bad.add(raw);
  }
  return {days:out,bad:[...bad]};
}

/* ---------- crypto: PBKDF2 -> AES-GCM, payload in URL hash ---------- */
const b64u=b=>{let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
async function keyFor(pin,salt){
  const base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);

async function seal(obj,pin){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await keyFor(pin,salt),enc.encode(JSON.stringify(obj))));
  const all=new Uint8Array(28+ct.length);all.set(salt);all.set(iv,16);all.set(ct,28);
  return '1'+b64u(all);
}
async function open_(hash,pin){
  if(hash[0]!=='1')throw new Error('format');
  const all=ub64u(hash.slice(1));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(16,28)},await keyFor(pin,all.slice(0,16)),all.slice(28));
  return JSON.parse(dec.decode(pt));
}

let S=null,PIN='',dirty=false,M=null,SEL=null,CUR='cal',BIG=EDIT;

const rngTxt=()=>{const r=rng(),g=t('monG');return `${g[r.fm-1]} ${r.fy} – ${g[r.tm-1]} ${r.ty}`};

/* ---------- model ---------- */
function model(){
  const r=rng(),y=r.ty,yA=r.a,yB=r.b;
  const hol=parseSpecs(S.h,r.years).days, av=parseSpecs(S.a,r.years).days;
  const exOff=parseSpecs(S.w||'',r.years).days, exWork=parseSpecs(S.ws||'',r.years).days;
  const off=d=>hol.has(d)||exOff.has(d)||(!exWork.has(d)&&[0,6].includes(dt(d).getUTCDay()));
  const cyc=S.c.map(s=>{const [d,l]=s.split(':');return {s:fromIso(d),l:+l||5}}).sort((a,b)=>a.s-b.s);
  const lens=[];for(let i=1;i<cyc.length;i++)lens.push(cyc[i].s-cyc[i-1].s);
  const rec=lens.slice(-6),avgL=rec.length?rec.reduce((a,b)=>a+b,0)/rec.length:null;
  const sdL=lens.length>1?Math.sqrt(lens.slice(-12).reduce((a,b,_,r)=>a+(b-r.reduce((x,z)=>x+z,0)/r.length)**2,0)/(Math.min(12,lens.length)-1)):null;
  const pl=cyc.slice(-6).map(c=>c.l),avgP=pl.length?Math.round(pl.reduce((a,b)=>a+b,0)/pl.length):5;
  const likely=new Set(),maybe=new Set(),starts=[],today=dn(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate());
  const mark=(s,l)=>{range(s,s+l-1).forEach(d=>likely.add(d));if(s>=today)for(let j=1;j<=S.f;j++){maybe.add(s-j);maybe.add(s+l-1+j)}};
  cyc.forEach(c=>{mark(c.s,c.l);starts.push(c.s)});
  if(cyc.length&&avgL&&avgL>=15&&avgL<=60){
    const last=cyc[cyc.length-1].s;
    for(let k=1;;k++){const s=Math.round(last+k*avgL);if(s>yB+40)break;starts.push(s);mark(s,avgP)}
  }
  likely.forEach(d=>maybe.delete(d));
  return {y,yA,yB,hol,av,off,cyc,avgL,sdL,avgP,likely,maybe,starts:starts.filter(s=>s>=today)};
}
function span(p){ // calendar days; holidays are not counted and extend the part

const lexLess=(k,b)=>{for(let j=0;j<k.length;j++)if(k[j]!==b[j])return k[j]<b[j];return false};
// Place part i inside its chosen month: fewest avoid-dates, then longest run of days off
// (vacation + adjacent weekends/holidays/transfers), then fewest period days, then a working-day start,
// then closest to current start.
function fit(i){
  const p=S.p[i];if(!p[3])return false;
  const [yy,mm]=ym(p[3]),a=dn(yy,mm,1),b=dn(yy,mm+1,1)-1,busy=others(i),cur=fromIso(p[0]);let best=null;
  for(let s=a;s<=b;s++){
    const ds=span([iso(s),p[1],p[2]]);
    if(ds[0]<M.yA||ds[ds.length-1]>M.yB||ds.some(d=>busy.has(d)))continue;
    const h=hits(ds),k=[h.a.length,-streak(ds).total,h.l,M.off(s)?1:0,Math.abs(s-cur)];
    if(!best||lexLess(k,best.k))best={s,k};
  }
  if(best)p[0]=iso(best.s);return !!best;
}
function others(i){const s=new Set();S.p.forEach((p,j)=>{if(j!==i)span(p).forEach(d=>s.add(d))});return s}
// Ideas for the year days not yet placed: blocks that start and end on working days, contain no avoid dates,
// touch a weekday public day off, give >= 2 days off per vacation day; per cluster keep the biggest gain.
function ideas(){
  const R=S.v.year-S.p.filter(p=>p[2]==='y').reduce((a,p)=>a+p[1],0);if(R<=0)return {R,list:[]};
  const busy=new Set();S.p.forEach(p=>span(p).forEach(d=>busy.add(d)));
  const a=Math.max(M.yA,dn(M.y,1,1)),b=Math.min(M.yB,dn(M.y,12,31)),wk=d=>[0,6].includes(dt(d).getUTCDay()),best=new Map();
  for(let s=a;s<=b;s++){if(M.off(s))continue;
    for(let L=1;L<=Math.min(R,10);L++){
      const ds=span([iso(s),L,'y']),e=ds[ds.length-1];if(e>b)break;
      if(ds.some(d=>busy.has(d)||M.av.has(d)))break;
      if(M.off(e))continue;
      const sk=streak(ds),w0=ds[0]-sk.before,w1=e+sk.after;if(busy.has(w0-1)||busy.has(w1+1))continue;
      let key=null;for(let d=w0;d<=w1;d++)if(!wk(d)&&M.off(d)){key=d;break}
      if(key===null||sk.total/L<2)continue;
      const c={s,L,w0,w1,total:sk.total,gain:sk.total-L,ratio:sk.total/L,per:hits(ds).l},o=best.get(key);
      if(!o||lexLess([-c.gain,-c.ratio,c.per],[-o.gain,-o.ratio,o.per]))best.set(key,c);
    }}
  const out=[];for(const c of [...best.values()].sort((x,z)=>x.w0-z.w0)){const pr=out[out.length-1];if(pr&&c.w0<=pr.w1){if(c.gain>pr.gain)out[out.length-1]=c;continue}out.push(c)}
  return {R,list:out};
}

function st(kind,txt){return `<div class="st ${kind}"><i>${kind==='ok'?'✓':kind==='warn'?'!':kind==='info'?'●':'×'}</i><span>${txt}</span></div>`}
function runs(days,set){const out=[];let s=null,p=null;for(const d of days){if(set.has(d)){if(s===null)s=d;p=d}else if(s!==null){out.push([s,p]);s=null}}if(s!==null)out.push([s,p]);
  return out.map(([a,b])=>a===b?nice(a):(dt(a).getUTCMonth()===dt(b).getUTCMonth()?dt(a).getUTCDate():nice(a))+'–'+nice(b)).join(', ')}
function renderSummary(){
  const v=S.v,pc=S.p.filter(p=>p[2]==='c'),py=S.p.filter(p=>p[2]==='y');
  const sc=pc.reduce((a,p)=>a+p[1],0),sy=py.reduce((a,p)=>a+p[1],0);
  let h='';
  if(v.carry>0){
    const okSplit=v.split||(pc.length<=1);
    h+=st(sc===v.carry&&okSplit?'ok':sc>v.carry||!okSplit?'bad':'warn',t('sumCarry',sc,v.carry,!v.split,!okSplit,sc<v.carry?v.carry-sc:0));
  }
  if(v.year>0){
    h+=st(sy>v.year?'bad':sy===v.year?'ok':'warn',t('sumYear',M.y,sy,v.year,sy<v.year?v.year-sy:0,sy>v.year?sy-v.year:0));
    if(v.min>0&&py.length){const mx=Math.max(...py.map(p=>p[1]));h+=st(mx>=v.min?'ok':'bad',mx>=v.min?t('sumMinOk',v.min):t('sumMinBad',v.min,mx))}
  }
  const all=[];S.p.forEach(p=>all.push(...span(p)));
  if(new Set(all).size<all.length)h+=st('bad',t('sumOverlap'));
  if(all.some(d=>d<M.yA||d>M.yB))h+=st('warn',t('sumOut',rngTxt()));
  const x=hits([...new Set(all)]);
  if(S.p.length)h+=st(x.l||x.m?'info':'ok',x.l||x.m?t('sumPer',x.l,x.m):t('sumPerNone'));
  if(S.p.length&&x.a.length)h+=st('warn',t('sumAvoid',x.a.map(nice).join(', ')));

}

$('links').addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;const ok=await copy(b.dataset.copy);b.textContent=t(ok?'copied':'selected');setTimeout(()=>b.textContent=t('copy'),1500)});
$('lockForm').onsubmit=async e=>{
  e.preventDefault();const pin=$('pinIn').value.trim();if(!pin)return;
  $('lockBtn').disabled=true;$('lockErr').textContent=t('checking');
  try{S=await open_(location.hash.slice(1),pin);PIN=pin;$('pinSave').value=pin;
    if(!LANG_PREF&&S.l&&I[S.l]&&S.l!==LANG){LANG=S.l;applyStatic();buildTabs()}
    show()}
  catch(_){$('lockErr').textContent=t('badPin');$('pinIn').select()}
  $('lockBtn').disabled=false;
};
$('newLink').onclick=e=>{e.preventDefault();history.replaceState(null,'',location.pathname+'?edit');S=blank();dirty=true;show('data')};
addEventListener('hashchange',()=>location.reload());
// view -> edit in place: same data, PIN already known, keeps the selected part
function enterEdit(){
  EDIT=true;document.body.classList.remove('view');history.replaceState(null,'','?edit&v='+BUILD+location.hash);
  $('pinSave').value=PIN;BIG=true;try{const z=localStorage.getItem('plan.big');if(z!==null)BIG=z==='1'}catch(_){}
  applyStatic();buildTabs();render();tab('cal');
}
$('toEdit').onclick=enterEdit;
// language switch: remembered on this device; in the editor it also goes into the next saved link
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{
  LANG=LANG==='be'?'ru':'be';LANG_PREF=LANG;try{localStorage.setItem('plan.lang',LANG)}catch(_){}
  if(S&&EDIT&&S.l!==LANG){S.l=LANG;dirty=true}
  applyStatic();buildTabs();if(S&&M){render();tab(CUR)}
});

/* ---------- help: guided tour over the real UI ---------- */
const firstSelCell=()=>{if(SEL===null&&S.p.length){SEL=0;renderCal();if(EDIT)renderChips();selbar()}return SEL!==null?document.querySelector(`[data-d="${span(S.p[SEL])[0]}"]`):null};
const firstVacCell=()=>S.p.length?document.querySelector(`[data-d="${span(S.p[0])[0]}"]`):null;
const STEPS_EDIT=[
  {tab:'cal',el:()=>$('chips')},
  {tab:'cal',el:firstSelCell},
  {tab:'cal',el:()=>{firstSelCell();return $('selbar').querySelector('.sa')},demo:true},
  {tab:'cal',el:()=>$('selbar').querySelectorAll('.sa')[1]},
  {tab:'cal',el:()=>$('ideas').querySelector('button')},
  {tab:'cal',el:()=>document.querySelector('.legend')},
  {tab:'parts',el:()=>$('summary')},
  {tab:'link',el:()=>$('savebar')}];
const STEPS_VIEW=[
  {tab:'cal',el:()=>document.querySelector('.legend')},
  {tab:'cal',el:firstVacCell},
  {tab:'cal',el:()=>$('toEdit')},
  {tab:'parts',el:()=>$('summary')}];
let CO=null;
function coach(){CO={st:EDIT?STEPS_EDIT:STEPS_VIEW,txt:t(EDIT?'E':'V'),i:-1,demo:null};$('coach').classList.remove('hidden');coachStep(1)}
function coachEnd(){demoStop();CO=null;$('coach').classList.add('hidden');if(CUR!=='cal')tab('cal')}
function coachStep(dir){
  demoStop();let i=CO.i,el=null;
  do{i+=dir;if(i<0||i>=CO.st.length)return coachEnd();const s=CO.st[i];if(CUR!==s.tab)tab(s.tab);el=s.el()}while(!el||!el.getClientRects().length);
  CO.i=i;const s=CO.st[i];
  if(getComputedStyle(el).position!=='fixed'&&!el.closest('.selbar,.tabs,.chips'))el.scrollIntoView({block:'center'});
  setTimeout(()=>{const r=el.getBoundingClientRect(),sp=$('coach').querySelector('.spot'),tp=$('coach').querySelector('.tip'),pad=6;
    Object.assign(sp.style,{top:r.top-pad+'px',left:r.left-pad+'px',width:r.width+2*pad+'px',height:r.height+2*pad+'px'});
    $('coachN').textContent=t('coachN',i+1,CO.st.length);$('coachT').textContent=CO.txt[i];$('coachNext').textContent=t(i===CO.st.length-1?'done':'next');
    if(r.top+r.height/2>innerHeight/2){tp.style.top='';tp.style.bottom=Math.max(12,innerHeight-r.top+pad+10)+'px'}else{tp.style.bottom='';tp.style.top=Math.min(innerHeight-180,r.bottom+pad+10)+'px'}
    if(s.demo)demoRun();},30);
}
// demo: move the selected part a few days and back without touching saved state
function demoRun(){const p=S.p[SEL];if(!p)return;const orig=p[0],seq=[1,2,3,2,1,0];let k=0;
  CO.demo={orig,p,t:setInterval(()=>{p[0]=iso(fromIso(orig)+seq[k]);renderCal();selbar();if(++k>=seq.length)demoStop()},450)}}
function demoStop(){if(!CO||!CO.demo)return;clearInterval(CO.demo.t);CO.demo.p[0]=CO.demo.orig;CO.demo=null;renderCal();selbar()}
$('help').onclick=coach;$('coachNext').onclick=()=>coachStep(1);$('coachX').onclick=coachEnd;
addEventListener('keydown',e=>{if(CO&&e.key==='Escape')coachEnd()});

/* ---------- start ---------- */
function show(first){$('lock').classList.add('hidden');$('app').classList.remove('hidden');$('tabs').classList.remove('hidden');render();tab(first||'cal')}
applyStatic();buildTabs();
if(!window.crypto||!crypto.subtle){document.body.innerHTML=`<p style="padding:24px">${t('noCrypto')}</p>`}
else if(location.hash.length>1){$('lock').classList.remove('hidden');setTimeout(()=>$('pinIn').focus(),50)}
else if(EDIT){S=blank();dirty=true;show('data')}
else $('empty').classList.remove('hidden');
</script>
</body>
</html>
